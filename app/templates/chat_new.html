<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chatbot</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/11.1.1/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            font-family: 'Roboto', sans-serif;
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100vh;
            overflow: hidden;
        }
        
        .chat-widget {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            width: 100%;
            height: 100%;
            z-index: 1000;
            display: block;
            opacity: 1;
            visibility: visible;
        }
        
        .chat-container {
            height: 100%;
            width: 100%;
            display: flex;
            flex-direction: column;
            background: #FFFFFF;
            border-radius: 0;
            box-shadow: none;
            border: none;
            overflow: hidden;
        }
        
        .chat-header {
            background: linear-gradient(135deg, #3FCCB2, #49BBBD);
            color: #F7FBFA;
            padding: 1.2rem 1.5rem;
            text-align: center;
            font-weight: 600;
            font-size: 1.1rem;
            position: relative;
            flex-shrink: 0;
        }
        
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
            background: #FCFFFE;
            scroll-behavior: smooth;
        }
        
        .message {
            margin-bottom: 0.75rem;
            display: flex;
            align-items: flex-start;
            animation: fadeIn 0.3s ease-in;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .message.bot {
            justify-content: flex-start;
        }
        
        .message.user {
            justify-content: flex-end;
        }
        
        .message-content {
            max-width: 80%;
            padding: 0.85rem 1.1rem;
            border-radius: 16px;
            word-wrap: break-word;
            line-height: 1.6;
            font-size: 0.95rem;
        }
        
        .message.user .message-content {
            background: linear-gradient(135deg, #3FCCB2, #00b190);
            color: #F7FBFA;
            border-bottom-right-radius: 6px;
            box-shadow: 0 2px 8px rgba(63, 204, 178, 0.3);
            white-space: pre-wrap;
        }
        
        .message.bot .message-content {
            background: #F4F7F6;
            color: #0F2B2A;
            border: 1px solid #EFF7F6;
            border-bottom-left-radius: 6px;
            box-shadow: 0 1px 4px rgba(15, 43, 42, 0.08);
        }
        
        /* Markdown Styles */
        .message.bot .message-content h1,
        .message.bot .message-content h2,
        .message.bot .message-content h3,
        .message.bot .message-content h4 {
            margin-top: 1em;
            margin-bottom: 0.5em;
            font-weight: 600;
            color: #0F2B2A;
        }
        
        .message.bot .message-content h1:first-child,
        .message.bot .message-content h2:first-child,
        .message.bot .message-content h3:first-child,
        .message.bot .message-content h4:first-child {
            margin-top: 0;
        }
        
        .message.bot .message-content h1 { font-size: 1.5em; }
        .message.bot .message-content h2 { font-size: 1.3em; }
        .message.bot .message-content h3 { font-size: 1.15em; }
        .message.bot .message-content h4 { font-size: 1em; }
        
        .message.bot .message-content p {
            margin-bottom: 0.8em;
        }
        
        .message.bot .message-content p:last-child {
            margin-bottom: 0;
        }
        
        .message.bot .message-content ul,
        .message.bot .message-content ol {
            margin: 0.8em 0;
            padding-left: 1.5em;
        }
        
        .message.bot .message-content li {
            margin-bottom: 0.4em;
        }
        
        .message.bot .message-content code {
            background: #e8f5f3;
            padding: 0.2em 0.4em;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
            color: #0F2B2A;
        }
        
        .message.bot .message-content pre {
            background: #1e1e1e;
            padding: 1em;
            border-radius: 8px;
            overflow-x: auto;
            margin: 0.8em 0;
        }
        
        .message.bot .message-content pre code {
            background: none;
            padding: 0;
            color: #d4d4d4;
            font-size: 0.9em;
            display: block;
        }
        
        .message.bot .message-content blockquote {
            border-left: 4px solid #3FCCB2;
            padding-left: 1em;
            margin: 0.8em 0;
            color: #5C8683;
            font-style: italic;
        }
        
        .message.bot .message-content strong {
            font-weight: 600;
            color: #0F2B2A;
        }
        
        .message.bot .message-content em {
            font-style: italic;
        }
        
        .message.bot .message-content a {
            color: #3FCCB2;
            text-decoration: none;
            border-bottom: 1px solid transparent;
            transition: border-bottom-color 0.2s;
        }
        
        .message.bot .message-content a:hover {
            border-bottom-color: #3FCCB2;
        }
        
        .message.bot .message-content table {
            border-collapse: collapse;
            width: 100%;
            margin: 0.8em 0;
        }
        
        .message.bot .message-content table th,
        .message.bot .message-content table td {
            border: 1px solid #EFF7F6;
            padding: 0.5em;
            text-align: left;
        }
        
        .message.bot .message-content table th {
            background: #e8f5f3;
            font-weight: 600;
        }
        
        .message.bot .message-content hr {
            border: none;
            border-top: 1px solid #EFF7F6;
            margin: 1em 0;
        }
        
        .chat-input {
            display: flex;
            padding: 1rem;
            background: #FFFFFF;
            border-top: 1px solid #EFF7F6;
            gap: 0.5rem;
            flex-shrink: 0;
            align-items: flex-end;
        }
        
        .input-field {
            flex: 1;
            padding: 0.75rem 1rem;
            border: 2px solid #EFF7F6;
            border-radius: 20px;
            outline: none;
            font-size: 14px;
            font-family: 'Roboto', sans-serif;
            height: 40px;
            transition: border-color 0.2s ease;
            color: #0F2B2A;
            background: #FCFFFE;
        }
        
        .input-field:focus {
            border-color: #3FCCB2;
            box-shadow: 0 0 0 3px rgba(63, 204, 178, 0.1);
        }
        
        .input-field::placeholder {
            color: #9CB8B6;
        }
        
        .send-button {
            padding: 0.75rem 1.25rem;
            background: linear-gradient(135deg, #3FCCB2, #00b190);
            color: #F7FBFA;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.2s ease;
            white-space: nowrap;
            min-width: 60px;
            font-family: 'Roboto', sans-serif;
            height: 40px;
            flex-shrink: 0;
        }
        
        .send-button:hover:not(:disabled) {
            background: linear-gradient(135deg, #00b190, #009272);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(63, 204, 178, 0.4);
        }
        
        .send-button:disabled {
            background: #9CB8B6;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        
        .typing-indicator {
            display: none;
            margin-bottom: 0.75rem;
        }
        
        .typing-indicator-content {
            padding: 0.75rem 1rem;
            background: #F4F7F6;
            border: 1px solid #EFF7F6;
            border-radius: 16px;
            border-bottom-left-radius: 6px;
            box-shadow: 0 1px 4px rgba(15, 43, 42, 0.08);
            width: fit-content;
        }
        
        .typing-dots {
            display: inline-flex;
            gap: 4px;
            align-items: center;
        }
        
        .typing-dots::before,
        .typing-dots::after,
        .typing-dots .dot {
            content: '';
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #5C8683;
            animation: typing-dot 1.4s infinite ease-in-out;
        }
        
        .typing-dots::before {
            animation-delay: 0s;
        }
        
        .typing-dots .dot {
            animation-delay: 0.2s;
        }
        
        .typing-dots::after {
            animation-delay: 0.4s;
        }
        
        @keyframes typing-dot {
            0%, 60%, 100% {
                transform: scale(1);
                opacity: 0.5;
            }
            30% {
                transform: scale(1.2);
                opacity: 1;
            }
        }
        
        .cursor {
            color: #3FCCB2;
            animation: blink 1s infinite;
            font-weight: bold;
        }
        
        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }
        
        .chat-messages::-webkit-scrollbar {
            width: 4px;
        }
        
        .chat-messages::-webkit-scrollbar-track {
            background: #EFF7F6;
        }
        
        .chat-messages::-webkit-scrollbar-thumb {
            background: #9CB8B6;
            border-radius: 2px;
        }
        
        .chat-messages::-webkit-scrollbar-thumb:hover {
            background: #5C8683;
        }
        
        @media (max-width: 768px) {
            .chat-widget {
                bottom: 0;
                right: 0;
                left: 0;
                width: 100%;
                height: 100vh;
                border-radius: 0;
            }
            
            .chat-container {
                border-radius: 0;
            }
            
            .message-content {
                max-width: 85%;
            }
            
            .input-field {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="chat-widget" id="chatWidget">
        <div class="chat-container">
            <div class="chat-messages" id="chatMessages"></div>
            
            <div class="chat-input">
                <input 
                    type="text"
                    class="input-field" 
                    id="messageInput" 
                    placeholder="Type your message..."
                    maxlength="2000"
                />
                <button class="send-button" id="sendButton" disabled>Send</button>
            </div>
        </div>
    </div>

    <script>
        // Configure marked
        marked.setOptions({
            breaks: true,
            gfm: true,
            highlight: function(code, lang) {
                if (lang && hljs.getLanguage(lang)) {
                    try {
                        return hljs.highlight(code, { language: lang }).value;
                    } catch (e) {}
                }
                return hljs.highlightAuto(code).value;
            }
        });

        class ChatBot {
            constructor() {
                this.sessionId = 'session_' + Math.random().toString(36).substr(2, 12) + '_' + Date.now();
                this.websocket = null;
                this.messageInput = document.getElementById('messageInput');
                this.sendButton = document.getElementById('sendButton');
                this.chatMessages = document.getElementById('chatMessages');
                this.chatWidget = document.getElementById('chatWidget');
                this.reconnectAttempts = 0;
                this.maxReconnectAttempts = 5;
                this.currentStreamingMessage = null;
                this.streamingContent = '';
                this.typingIndicator = null;
                
                this.init();
            }
            
            init() {
                this.setupEventListeners();
                this.connectWebSocket();
                this.addMessage('Hello! How can I help you? 😊', 'bot');
                setTimeout(() => this.messageInput.focus(), 300);
            }
            
            setupEventListeners() {
                this.sendButton.addEventListener('click', () => this.sendMessage());
                
                this.messageInput.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' && !e.shiftKey) {
                        e.preventDefault();
                        this.sendMessage();
                    }
                });
                
                this.messageInput.addEventListener('input', () => {
                    this.sendButton.disabled = !this.messageInput.value.trim();
                });
            }
            
            connectWebSocket() {
                try {
                    const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
                    const wsUrl = `${protocol}//${window.location.host}/ws/${this.sessionId}`;
                    console.log('Connecting to:', wsUrl);
                    
                    this.websocket = new WebSocket(wsUrl);
                    
                    this.websocket.onopen = () => {
                        console.log('✅ WebSocket connected');
                        this.reconnectAttempts = 0;
                    };
                    
                    this.websocket.onmessage = (event) => {
                        try {
                            const data = JSON.parse(event.data);
                            
                            if (data.type === 'stream_start') {
                                this.hideTyping();
                                this.streamingContent = '';
                                this.currentStreamingMessage = this.addStreamingMessage();
                            } else if (data.type === 'stream_chunk') {
                                this.streamingContent += data.content;
                                this.updateStreamingMessage();
                            } else if (data.type === 'stream_end') {
                                this.finalizeStreamingMessage();
                                this.enableInput();
                            } else if (data.type === 'bot_message') {
                                this.hideTyping();
                                this.addMessage(data.message, 'bot');
                                this.enableInput();
                            }
                        } catch (error) {
                            console.error('Error parsing message:', error);
                        }
                    };
                    
                    this.websocket.onclose = (event) => {
                        console.log('WebSocket disconnected:', event.code);
                        
                        if (this.reconnectAttempts < this.maxReconnectAttempts) {
                            this.reconnectAttempts++;
                            const delay = Math.min(1000 * Math.pow(2, this.reconnectAttempts), 30000);
                            console.log(`Reconnecting in ${delay}ms...`);
                            setTimeout(() => this.connectWebSocket(), delay);
                        }
                    };
                    
                    this.websocket.onerror = (error) => {
                        console.error('WebSocket error:', error);
                    };
                } catch (error) {
                    console.error('Failed to create WebSocket:', error);
                }
            }
            
            sendMessage() {
                const message = this.messageInput.value.trim();
                if (!message || !this.websocket || this.websocket.readyState !== WebSocket.OPEN) {
                    return;
                }
                
                this.addMessage(message, 'user');
                this.showTyping();
                this.disableInput();
                
                this.websocket.send(JSON.stringify({
                    message: message,
                    session_id: this.sessionId
                }));
                
                this.messageInput.value = '';
                this.sendButton.disabled = true;
            }
            
            addMessage(content, type) {
                const messageDiv = document.createElement('div');
                messageDiv.className = `message ${type}`;
                
                if (type === 'bot') {
                    // Render markdown for bot messages
                    const htmlContent = marked.parse(content);
                    messageDiv.innerHTML = `<div class="message-content">${htmlContent}</div>`;
                } else {
                    // Plain text for user messages
                    const escapedContent = this.escapeHtml(content);
                    messageDiv.innerHTML = `<div class="message-content">${escapedContent}</div>`;
                }
                
                this.chatMessages.appendChild(messageDiv);
                this.scrollToBottom();
            }
            
            addStreamingMessage() {
                const messageDiv = document.createElement('div');
                messageDiv.className = 'message bot';
                messageDiv.innerHTML = '<div class="message-content"><span class="streaming-content"></span><span class="cursor">|</span></div>';
                this.chatMessages.appendChild(messageDiv);
                this.scrollToBottom();
                return messageDiv;
            }
            
            updateStreamingMessage() {
                if (this.currentStreamingMessage) {
                    const streamingContentEl = this.currentStreamingMessage.querySelector('.streaming-content');
                    if (streamingContentEl) {
                        // Render markdown in real-time
                        streamingContentEl.innerHTML = marked.parse(this.streamingContent);
                        this.scrollToBottom();
                    }
                }
            }
            
            finalizeStreamingMessage() {
                if (this.currentStreamingMessage) {
                    const cursor = this.currentStreamingMessage.querySelector('.cursor');
                    cursor?.remove();
                    
                    // Final markdown render
                    const streamingContentEl = this.currentStreamingMessage.querySelector('.streaming-content');
                    if (streamingContentEl) {
                        streamingContentEl.innerHTML = marked.parse(this.streamingContent);
                    }
                    
                    this.currentStreamingMessage = null;
                    this.streamingContent = '';
                }
            }
            
            showTyping() {
                if (!this.typingIndicator) {
                    this.typingIndicator = document.createElement('div');
                    this.typingIndicator.className = 'typing-indicator';
                    this.typingIndicator.innerHTML = `
                        <div class="typing-indicator-content">
                            <div class="typing-dots"><div class="dot"></div></div>
                        </div>
                    `;
                }
                this.chatMessages.appendChild(this.typingIndicator);
                this.typingIndicator.style.display = 'block';
                this.scrollToBottom();
            }
            
            hideTyping() {
                if (this.typingIndicator?.parentNode) {
                    this.typingIndicator.remove();
                    this.typingIndicator = null;
                }
            }
            
            disableInput() {
                this.messageInput.disabled = true;
                this.sendButton.disabled = true;
            }
            
            enableInput() {
                this.messageInput.disabled = false;
                this.sendButton.disabled = !this.messageInput.value.trim();
                this.messageInput.focus();
            }
            
            scrollToBottom() {
                setTimeout(() => {
                    this.chatMessages.scrollTop = this.chatMessages.scrollHeight;
                }, 100);
            }
            
            escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML.replace(/\n/g, '<br>');
            }
        }
        
        document.addEventListener('DOMContentLoaded', () => {
            new ChatBot();
        });
    </script>
</body>
</html>
