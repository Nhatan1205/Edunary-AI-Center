<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chatbot — Edunary</title>

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Markdown renderer -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/11.1.1/marked.min.js"></script>

    <!-- Syntax highlighting -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

    <!-- Chatbot stylesheet (extracted) -->
    <link rel="stylesheet" href="./static/css/chat.css">
</head>

<body>
    <div class="chat-widget" id="chatWidget">
        <div class="chat-container">
            <!-- Message thread -->
            <div class="chat-messages" id="chatMessages"></div>

            <!-- Input area -->
            <div class="chat-input">
                <input type="text" class="input-field" id="messageInput" placeholder="Type your message..."
                    maxlength="2000" />
                <button class="send-button" id="sendButton" disabled>Send</button>
            </div>
        </div>
    </div>

    <!-- Chatbot logic (extracted) -->
    <script src="./static/js/chatbot.js"></script>
</body>

</html>
