<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chatbot</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            height: 100vh;
            background: #F7FBFA;
            margin: 0;
            padding: 0;
        }
        
        /* Chat Toggle Button - Always visible */
        .chat-toggle {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, #3FCCB2, #49BBBD);
            color: #F7FBFA;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 16px rgba(63, 204, 178, 0.4);
            font-size: 24px;
            z-index: 1001;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .chat-toggle:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 20px rgba(63, 204, 178, 0.5);
        }
        
        .chat-toggle.active {
            background: linear-gradient(135deg, #00b190, #009272);
            transform: rotate(45deg);
        }
        
        /* Chat Container - Hidden by default */
        .chat-container {
            height: 600px;
            width: 380px;
            position: fixed;
            bottom: 90px; /* Above the toggle button */
            right: 20px;
            display: flex;
            flex-direction: column;
            background: #FFFFFF;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(15, 43, 42, 0.15);
            border: 1px solid #EFF7F6;
            z-index: 1000;
            transform: translateY(20px) scale(0.95);
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .chat-container.visible {
            transform: translateY(0) scale(1);
            opacity: 1;
            visibility: visible;
        }
        
        .chat-header {
            background: linear-gradient(135deg, #3FCCB2, #49BBBD);
            color: #F7FBFA;
            padding: 1rem 1.25rem;
            text-align: center;
            font-weight: 600;
            font-size: 1rem;
            border-radius: 16px 16px 0 0;
            position: relative;
            box-shadow: 0 2px 8px rgba(63, 204, 178, 0.2);
        }
        
        .chat-close {
            position: absolute;
            top: 50%;
            right: 16px;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #F7FBFA;
            font-size: 18px;
            cursor: pointer;
            padding: 4px;
            border-radius: 4px;
            transition: background 0.2s ease;
        }
        
        .chat-close:hover {
            background: rgba(247, 251, 250, 0.2);
        }
        
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
            background: #FCFFFE;
            scroll-behavior: smooth;
        }
        
        .message {
            margin-bottom: 0.75rem;
            display: flex;
            align-items: flex-start;
            animation: fadeIn 0.3s ease-in;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .message.user {
            justify-content: flex-end;
        }
        
        .message-content {
            max-width: 80%;
            padding: 0.75rem 1rem;
            border-radius: 16px;
            word-wrap: break-word;
            line-height: 1.5;
            white-space: pre-wrap;
            font-size: 0.9rem;
        }
        
        .message.user .message-content {
            background: linear-gradient(135deg, #3FCCB2, #00b190);
            color: #F7FBFA;
            border-bottom-right-radius: 6px;
            box-shadow: 0 2px 8px rgba(63, 204, 178, 0.3);
        }
        
        .message.bot .message-content {
            background: #F4F7F6;
            color: #0F2B2A;
            border: 1px solid #EFF7F6;
            border-bottom-left-radius: 6px;
            box-shadow: 0 1px 4px rgba(15, 43, 42, 0.08);
        }
        
        .chat-input {
            display: flex;
            padding: 1rem;
            background: #FFFFFF;
            border-top: 1px solid #EFF7F6;
            gap: 0.5rem;
            border-radius: 0 0 16px 16px;
        }
        
        .input-field {
            flex: 1;
            padding: 0.75rem 1rem;
            border: 2px solid #EFF7F6;
            border-radius: 20px;
            outline: none;
            font-size: 14px;
            font-family: 'Roboto', sans-serif;
            resize: none;
            min-height: 40px;
            max-height: 100px;
            transition: border-color 0.2s ease;
            color: #0F2B2A;
            background: #FCFFFE;
        }
        
        .input-field:focus {
            border-color: #3FCCB2;
            box-shadow: 0 0 0 3px rgba(63, 204, 178, 0.1);
        }
        
        .input-field::placeholder {
            color: #9CB8B6;
        }
        
        .send-button {
            padding: 0.75rem 1.25rem;
            background: linear-gradient(135deg, #3FCCB2, #00b190);
            color: #F7FBFA;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.2s ease;
            white-space: nowrap;
            min-width: 60px;
            font-family: 'Roboto', sans-serif;
        }
        
        .send-button:hover:not(:disabled) {
            background: linear-gradient(135deg, #00b190, #009272);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(63, 204, 178, 0.4);
        }
        
        .send-button:disabled {
            background: #9CB8B6;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        
        .typing-indicator {
            display: none;
            padding: 0.75rem 1rem;
            background: #F4F7F6;
            border: 1px solid #EFF7F6;
            border-radius: 16px;
            border-bottom-left-radius: 6px;
            margin-bottom: 0.75rem;
            color: #5C8683;
            font-style: italic;
            box-shadow: 0 1px 4px rgba(15, 43, 42, 0.08);
            font-size: 0.9rem;
        }
        
        .typing-dots {
            display: inline-block;
        }
        
        .typing-dots::after {
            content: '';
            animation: dots 1.5s infinite;
        }
        
        @keyframes dots {
            0%, 20% { content: ''; }
            40% { content: '.'; }
            60% { content: '..'; }
            80%, 100% { content: '...'; }
        }
        
        .connection-status {
            position: absolute;
            top: 12px;
            right: 50px;
            padding: 0.25rem 0.5rem;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 600;
        }
        
        .connection-status.connected {
            background: rgba(247, 251, 250, 0.2);
            color: #F7FBFA;
            border: 1px solid rgba(247, 251, 250, 0.3);
        }
        
        .connection-status.disconnected {
            background: rgba(255, 107, 107, 0.9);
            color: white;
        }
        
        .connection-status.connecting {
            background: rgba(255, 193, 7, 0.9);
            color: white;
        }
        
        /* Notification badge */
        .chat-badge {
            position: absolute;
            top: -5px;
            right: -5px;
            background: #ff4757;
            color: white;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            font-size: 12px;
            display: none;
            align-items: center;
            justify-content: center;
            font-weight: 600;
        }
        
        .chat-badge.show {
            display: flex;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }
        
        /* Responsive design */
        @media (max-width: 768px) {
            .chat-container {
                height: 100vh;
                width: 100vw;
                bottom: 0;
                right: 0;
                border-radius: 0;
                position: fixed;
            }
            
            .chat-header {
                border-radius: 0;
                padding: 1rem 1.25rem 1rem 1rem;
            }
            
            .chat-input {
                border-radius: 0;
            }
            
            .message-content {
                max-width: 85%;
                font-size: 14px;
            }
            
            .input-field {
                font-size: 16px; /* Prevents zoom on iOS */
            }
            
            .chat-toggle {
                bottom: 20px;
                right: 20px;
            }
        }
        
        /* Scrollbar styling */
        .chat-messages::-webkit-scrollbar {
            width: 4px;
        }
        
        .chat-messages::-webkit-scrollbar-track {
            background: #EFF7F6;
        }
        
        .chat-messages::-webkit-scrollbar-thumb {
            background: #9CB8B6;
            border-radius: 2px;
        }
        
        .chat-messages::-webkit-scrollbar-thumb:hover {
            background: #5C8683;
        }
    </style>
</head>
<body>
    <!-- Chat Toggle Button - Always visible -->
    <button class="chat-toggle" id="chatToggle">
        💬
        <div class="chat-badge" id="chatBadge">1</div>
    </button>
    
    <!-- Chat Container - Pop up when toggle clicked -->
    <div class="chat-container" id="chatContainer">
        <div class="chat-header">
            💬 Chat Bot
            <button class="chat-close" id="chatClose">✕</button>
            <div class="connection-status connecting" id="connectionStatus">Đang kết nối...</div>
        </div>
        
        <div class="chat-messages" id="chatMessages">
            <div class="message bot">
                <div class="message-content">
                    Hello! How can I help you? 🚀
                </div>
            </div>
        </div>
        
        <div class="typing-indicator" id="typingIndicator">
            <span class="typing-dots">AI đang suy nghĩ</span>
        </div>
        
        <div class="chat-input">
            <textarea 
                class="input-field" 
                id="messageInput" 
                placeholder="Nhập tin nhắn..."
                maxlength="2000"
                rows="1"
            ></textarea>
            <button class="send-button" id="sendButton" disabled>
                Gửi
            </button>
        </div>
    </div>

    <script>
        class ChatBot {
            constructor() {
                this.sessionId = this.generateSessionId();
                this.websocket = null;
                this.messageInput = document.getElementById('messageInput');
                this.sendButton = document.getElementById('sendButton');
                this.chatMessages = document.getElementById('chatMessages');
                this.typingIndicator = document.getElementById('typingIndicator');
                this.connectionStatus = document.getElementById('connectionStatus');
                this.chatContainer = document.getElementById('chatContainer');
                this.chatToggle = document.getElementById('chatToggle');
                this.chatClose = document.getElementById('chatClose');
                this.chatBadge = document.getElementById('chatBadge');
                this.reconnectAttempts = 0;
                this.maxReconnectAttempts = 5;
                this.isOpen = false;
                this.hasNewMessage = false;
                
                this.init();
            }
            
            generateSessionId() {
                return 'session_' + Math.random().toString(36).substr(2, 12) + '_' + Date.now();
            }
            
            init() {
                this.connectWebSocket();
                this.setupEventListeners();
                this.autoResizeTextarea();
                this.setupChatToggle();
            }
            
            setupChatToggle() {
                // Toggle chat visibility
                this.chatToggle.addEventListener('click', () => {
                    this.toggleChat();
                });
                
                // Close chat
                this.chatClose.addEventListener('click', () => {
                    this.closeChat();
                });
                
                // Close chat when clicking outside (optional)
                document.addEventListener('click', (e) => {
                    if (this.isOpen && 
                        !this.chatContainer.contains(e.target) && 
                        !this.chatToggle.contains(e.target)) {
                        this.closeChat();
                    }
                });
            }
            
            toggleChat() {
                if (this.isOpen) {
                    this.closeChat();
                } else {
                    this.openChat();
                }
            }
            
            openChat() {
                this.isOpen = true;
                this.chatContainer.classList.add('visible');
                this.chatToggle.classList.add('active');
                this.hideBadge();
                this.messageInput.focus();
                
                // Update toggle icon
                this.chatToggle.innerHTML = '✕<div class="chat-badge" id="chatBadge"></div>';
            }
            
            closeChat() {
                this.isOpen = false;
                this.chatContainer.classList.remove('visible');
                this.chatToggle.classList.remove('active');
                
                // Update toggle icon
                this.chatToggle.innerHTML = '💬<div class="chat-badge" id="chatBadge"></div>';
                this.chatBadge = document.getElementById('chatBadge');
                
                if (this.hasNewMessage) {
                    this.showBadge();
                }
            }
            
            showBadge() {
                if (this.chatBadge && !this.isOpen) {
                    this.chatBadge.classList.add('show');
                    this.hasNewMessage = true;
                }
            }
            
            hideBadge() {
                if (this.chatBadge) {
                    this.chatBadge.classList.remove('show');
                    this.hasNewMessage = false;
                }
            }
            
            updateConnectionStatus(status, text) {
                this.connectionStatus.className = `connection-status ${status}`;
                this.connectionStatus.textContent = text;
            }
            
            connectWebSocket() {
                try {
                    this.updateConnectionStatus('connecting', 'Đang kết nối...');
                    
                    const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
                    const wsUrl = `${protocol}//${window.location.host}/ws/${this.sessionId}`;
                    
                    this.websocket = new WebSocket(wsUrl);
                    
                    this.websocket.onopen = () => {
                        console.log('WebSocket connected');
                        this.updateConnectionStatus('connected', 'Đã kết nối');
                        this.reconnectAttempts = 0;
                        this.enableInput();
                    };
                    
                    this.websocket.onmessage = (event) => {
                        try {
                            const data = JSON.parse(event.data);
                            this.hideTyping();
                            this.addMessage(data.message, 'bot');
                            this.enableInput();
                            
                            // Show notification if chat is closed
                            if (!this.isOpen) {
                                this.showBadge();
                            }
                        } catch (error) {
                            console.error('Error parsing message:', error);
                        }
                    };
                    
                    this.websocket.onclose = (event) => {
                        console.log('WebSocket disconnected:', event.code, event.reason);
                        this.updateConnectionStatus('disconnected', 'Mất kết nối');
                        this.hideTyping();
                        this.enableInput();
                        
                        if (this.reconnectAttempts < this.maxReconnectAttempts) {
                            this.reconnectAttempts++;
                            const delay = Math.min(1000 * Math.pow(2, this.reconnectAttempts), 30000);
                            setTimeout(() => {
                                console.log(`Attempting to reconnect... (${this.reconnectAttempts}/${this.maxReconnectAttempts})`);
                                this.connectWebSocket();
                            }, delay);
                        }
                    };
                    
                    this.websocket.onerror = (error) => {
                        console.error('WebSocket error:', error);
                        this.updateConnectionStatus('disconnected', 'Lỗi kết nối');
                        this.hideTyping();
                        this.enableInput();
                    };
                } catch (error) {
                    console.error('Failed to create WebSocket:', error);
                    this.updateConnectionStatus('disconnected', 'Lỗi kết nối');
                }
            }
            
            setupEventListeners() {
                this.sendButton.addEventListener('click', () => this.sendMessage());
                
                this.messageInput.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' && !e.shiftKey) {
                        e.preventDefault();
                        this.sendMessage();
                    }
                });
                
                this.messageInput.addEventListener('input', () => {
                    this.sendButton.disabled = !this.messageInput.value.trim();
                    this.autoResizeTextarea();
                });
                
                // Handle page unload
                window.addEventListener('beforeunload', () => {
                    if (this.websocket) {
                        this.websocket.close();
                    }
                });
            }
            
            autoResizeTextarea() {
                this.messageInput.style.height = 'auto';
                this.messageInput.style.height = Math.min(this.messageInput.scrollHeight, 120) + 'px';
            }
            
            sendMessage() {
                const message = this.messageInput.value.trim();
                if (!message || !this.websocket || this.websocket.readyState !== WebSocket.OPEN) {
                    return;
                }
                
                this.addMessage(message, 'user');
                this.showTyping();
                this.disableInput();
                
                this.websocket.send(JSON.stringify({
                    message: message,
                    session_id: this.sessionId
                }));
                
                this.messageInput.value = '';
                this.autoResizeTextarea();
                this.sendButton.disabled = true;
            }
            
            addMessage(content, type) {
                const messageDiv = document.createElement('div');
                messageDiv.className = `message ${type}`;
                messageDiv.innerHTML = `<div class="message-content">${this.escapeHtml(content)}</div>`;
                
                this.chatMessages.appendChild(messageDiv);
                this.scrollToBottom();
            }
            
            showTyping() {
                this.typingIndicator.style.display = 'block';
                this.scrollToBottom();
            }
            
            hideTyping() {
                this.typingIndicator.style.display = 'none';
            }
            
            disableInput() {
                this.messageInput.disabled = true;
                this.sendButton.disabled = true;
            }
            
            enableInput() {
                this.messageInput.disabled = false;
                this.sendButton.disabled = !this.messageInput.value.trim();
                if (this.isOpen) {
                    this.messageInput.focus();
                }
            }
            
            scrollToBottom() {
                setTimeout(() => {
                    this.chatMessages.scrollTop = this.chatMessages.scrollHeight;
                }, 100);
            }
            
            escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML.replace(/\n/g, '<br>');
            }
        }
        
        // Khởi tạo chatbot khi trang được load
        document.addEventListener('DOMContentLoaded', () => {
            new ChatBot();
        });
    </script>
</body>
</html>
